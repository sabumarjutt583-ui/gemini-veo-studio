# electron-builder configuration — Windows installer (Gemini-Veo-Studio-Setup.exe).
#
# Data (SQLite db, browser profiles, video library) lives OUTSIDE the install
# folder under %APPDATA%/gemini-veo-studio, so updates/uninstalls never touch
# the user's data (requirement 19). The native better-sqlite3 binary ships as an
# app dependency and is re-resolved by the postinstall `electron-builder
# install-app-deps` hook so it links against Electron's ABI.

appId: com.geminiveostudio.app
productName: Gemini Veo Studio
copyright: Copyright © 2026 Gemini Veo Studio
win:
  target:
    - target: nsis
      arch: [x64]
  # PNG (256x256) — electron-builder converts it to .ico for the NSIS installer.
  # Regenerate with `npm run icon` if it is missing.
  icon: assets/icon.png
  artifactName: Gemini-Veo-Studio-Setup-${version}.${ext}
  # Persist user data across updates: keep the appData directory untouched.
  asarUnpack:
    - "node_modules/better-sqlite3/**"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Gemini Veo Studio
  deleteAppDataOnUninstall: false
  # Customized + silent-install friendly.
  perMachine: false
files:
  - dist/**/*
  # Old unpacked apps from local `electron-builder` runs never ship inside
  # the asar — vite build clears dist/ in CI, but local leftovers would
  # otherwise balloon the package.
  - "!dist/win-unpacked/**"
  - "!dist/*.blockmap"
  - dist-electron/**/*
  - node_modules/**/*
  # Exclude build artifacts (source maps, TS, tests, devDeps) and better-sqlite3
  # debug symbols so the installer only carries runtime files.
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/better-sqlite3/**/*.pdb"
  - "!node_modules/better-sqlite3/**/*.iobj"
  - "!node_modules/better-sqlite3/**/*.ipdb"
  - "!node_modules/better-sqlite3/**/sqlite3.lib"
  - "!node_modules/better-sqlite3/**/test_extension*"
  # Frontend devDependencies (react, lucide-react, date-fns, etc.) bundle
  # into dist/ via Vite; their raw node_modules copies are not needed at runtime.
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/date-fns/**"
  - "!node_modules/zod/**"
  - "!node_modules/zustand/**"
  - "!node_modules/react-hook-form/**"
  - "!node_modules/react-router/**"
  - "!node_modules/react-router-dom/**"
  # @ffmpeg-installer is now a devDependency — thumbnails already have a
  # graceful placeholder fallback, and its 60 MB binary is not needed.
  - "!node_modules/@ffmpeg-installer/**"
  # better-sqlite3 prebuilds (native) must be copied into the package.
  - "package.json"
extraResources: []
asar: true
