name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Host Node 20 ke liye better-sqlite3 ka binary (prebuild).
      - run: npm rebuild better-sqlite3
      - run: npm run typecheck
      - run: npm test

  release:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Icon gitignored hai — CI mein regenerate hokar electron-builder ko deta hai.
      - run: npm run icon
      - run: npm run build:win
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
